[tool.poetry]
name = "gdp-wage-transmission"
version = "0.6.0"
description = "Empirical models for the transmission from GDP and labour productivity to real wages."
authors = ["Diogo Ribeiro"]
readme = "README.md"
packages = [{ include = "wage_transmission", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
numpy = ">=1.26"
pandas = ">=2.1"
scipy = ">=1.11"
statsmodels = ">=0.14"
matplotlib = ">=3.8"
httpx = ">=0.27"
PyYAML = ">=6.0"
typer = ">=0.12"
pydantic = ">=2.6"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-cov = ">=5.0"
ruff = ">=0.6"
mypy = ">=1.11"
pandas-stubs = ">=2.2"
pre-commit = ">=3.8"
nbformat = ">=5.10"

[tool.poetry.scripts]
wage-transmission = "wage_transmission.cli:app"

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
packages = ["wage_transmission"]

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
