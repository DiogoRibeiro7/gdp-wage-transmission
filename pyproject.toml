[project]
name = "gdp-wage-transmission"
version = "0.8.4"
description = "Empirical models for the transmission from GDP and labour productivity to real wages."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Diogo Ribeiro" }]
maintainers = [{ name = "Diogo Ribeiro" }]
keywords = [
  "economics",
  "labour-economics",
  "wages",
  "productivity",
  "time-series",
  "econometrics",
  "reproducible-research",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "statsmodels>=0.14",
  "matplotlib>=3.8",
  "httpx>=0.27",
  "PyYAML>=6.0",
  "typer>=0.12",
  "pydantic>=2.6",
]

[project.urls]
Homepage = "https://github.com/DiogoRibeiro7/gdp-wage-transmission"
Repository = "https://github.com/DiogoRibeiro7/gdp-wage-transmission"
Issues = "https://github.com/DiogoRibeiro7/gdp-wage-transmission/issues"
Changelog = "https://github.com/DiogoRibeiro7/gdp-wage-transmission/blob/main/CHANGELOG.md"

[project.scripts]
wage-transmission = "wage_transmission.cli:app"

[tool.poetry]
requires-poetry = ">=2.0"
packages = [{ include = "wage_transmission", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-cov = ">=5.0"
ruff = ">=0.6"
mypy = ">=1.11"
pandas-stubs = ">=2.2"
scipy-stubs = ">=1.11"
types-PyYAML = ">=6.0"
pre-commit = ">=3.8"
nbformat = ">=5.10"
ipykernel = "^7.3.0"
nbclient = "^0.11.0"

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config --disable-warnings"
testpaths = ["tests"]
# `tools/` holds runnable analysis scripts that are imported by their tests.
pythonpath = ["."]
markers = [
  "slow: marks tests that run a full estimation stack (deselect with '-m \"not slow\"')",
  "network: marks tests that require outbound access to official statistical APIs",
]

[tool.coverage.run]
source = ["wage_transmission"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
# Floor set just below the current measured line/branch coverage; raise it as suites grow.
fail_under = 65
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tools", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]
# Economic notation legitimately uses en dashes (Engle–Granger, GDP–wage).
allowed-confusables = ["–", "—", "×", "−"]

[tool.ruff.lint.flake8-bugbear]
# Typer declares CLI metadata through call expressions in argument defaults.
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.ruff.lint.per-file-ignores]
# Notebooks are exploratory: allow unused imports and star-style scratch code.
"notebooks/*.ipynb" = ["B018", "F401"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
packages = ["wage_transmission"]

[[tool.mypy.overrides]]
# statsmodels ships no type information; its estimation results are untyped.
module = ["statsmodels.*"]
ignore_missing_imports = true

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
